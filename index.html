<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小哲分享</title>
<style>
  /* ============ 自定义区：改这里调颜色 ============ */
  :root{
    --bg1:#2a1f1a;
    --bg2:#3a2a22;
    --bg3:#241a18;
    --glass:rgba(255,255,255,.12);
    --glass-strong:rgba(255,255,255,.16);
    --glass-border:rgba(255,255,255,.22);
    --highlight:rgba(255,255,255,.28);
    --text:#fbf3ea;
    --sub:#e6cfc0;
    --accent:#ffc37a;
    --blob1:#ff9a5a;
    --blob2:#ff7ab0;
    --blob3:#ffd27a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    min-height:100vh;
    background:var(--bg3);
    padding:36px 18px 60px;
    position:relative;
    overflow-x:hidden;
  }
  /* 背景图：先出底色，图片加载完再淡入 */
  .bg{position:fixed;inset:0;z-index:0;background:url("assets/bg.jpg") center/cover fixed;opacity:0;transition:opacity .9s ease;}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(20,15,12,.28),rgba(20,15,12,.40));}
  .bg.loaded{opacity:1;}
  /* 背景光斑 */
  .blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:0;z-index:0;pointer-events:none;}
  .blob.b1{width:320px;height:320px;background:var(--blob1);top:-90px;left:-70px;}
  .blob.b2{width:300px;height:300px;background:var(--blob2);top:18%;right:-90px;}
  .blob.b3{width:280px;height:280px;background:var(--blob3);bottom:-80px;left:18%;}

  .wrap{max-width:880px;margin:0 auto;position:relative;z-index:1;}

  /* 玻璃通用层 */
  .glass{
    background:linear-gradient(135deg,var(--glass-strong),var(--glass));
    border:1px solid var(--glass-border);
    backdrop-filter:blur(26px) saturate(150%);
    -webkit-backdrop-filter:blur(26px) saturate(150%);
    box-shadow:
      0 10px 40px rgba(0,0,0,.30),
      inset 0 1px 0 var(--highlight),
      inset 0 -1px 0 rgba(255,255,255,.06);
  }

  /* 头部（全透明，文字直接压背景） */
  .hero{
    padding:32px 24px;
text-align:center;
    margin-bottom:22px;
    position:relative;
  }
  .hero .avatar{
    width:74px;height:74px;border-radius:23px;margin:0 auto 14px;
    background:linear-gradient(135deg,var(--blob1),var(--blob2));
    display:flex;align-items:center;justify-content:center;font-size:34px;
    box-shadow:0 10px 28px rgba(91,140,255,.40),inset 0 1px 0 rgba(255,255,255,.35);
    position:relative;
  }
  .hero h1{
    font-size:25px;font-weight:700;letter-spacing:.5px;position:relative;
    text-shadow:0 2px 12px rgba(0,0,0,.65),0 1px 3px rgba(0,0,0,.5);
  }
  .hero p{
    margin-top:8px;color:var(--sub);font-size:14px;position:relative;
    text-shadow:0 1px 8px rgba(0,0,0,.6);
  }

  /* 分组 */
  section{margin-bottom:28px;}
  section h2{
    font-size:15px;font-weight:600;margin-bottom:14px;color:var(--sub);
    display:flex;align-items:center;gap:8px;letter-spacing:.5px;
  }
  section h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;}
  @media (max-width:640px){ .grid{grid-template-columns:repeat(2,1fr);} }
  .card{
    display:flex;align-items:center;gap:14px;
    border-radius:20px;padding:17px 18px;text-decoration:none;color:var(--text);
    transition:.22s;position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(120deg,rgba(255,255,255,.14),transparent 45%);
    opacity:0;transition:.22s;pointer-events:none;
  }
  .card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.35);}
  .card:hover::before{opacity:1;}
  .card:active{transform:scale(.98);}
  .card .icon{
    width:47px;height:47px;border-radius:15px;flex-shrink:0;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center;font-size:23px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
  }
  .card .info{min-width:0;}
  .card .title{font-weight:600;font-size:15px;margin-bottom:3px;}
.card .desc{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .empty{text-align:center;color:var(--sub);padding:30px 0;display:none;}
  footer{text-align:center;margin-top:34px;color:var(--sub);font-size:12px;opacity:.7;}

  /* ===== 动态雪花层 ===== */
  #snow{
    position:fixed;inset:0;z-index:20;pointer-events:none;
  }

  /* ===== 网格内自适应播放器卡片 ===== */
  .player-card{flex-direction:column;align-items:stretch;gap:10px;width:100%;cursor:default;}
  .pc-head{display:flex;align-items:center;gap:14px;min-width:0;}
  .pc-head .info{min-width:0;}
  .bar-title{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-state{display:block;font-size:12px;color:var(--sub);margin-top:3px;}
  .player-card .controls{display:flex;align-items:center;justify-content:center;gap:16px;}
  .player-card #progress{width:100%;}
  .pbtn{
    width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.28);
background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
    color:var(--text);font-size:15px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
    backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.30),inset 0 -2px 5px rgba(255,255,255,.08),0 4px 12px rgba(0,0,0,.18);
    transition:transform .2s,background .2s,box-shadow .2s,border-color .2s;
  }
  .pbtn:hover{transform:scale(1.12);background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,.12));border-color:rgba(255,255,255,.40);}
  .pbtn:active{transform:scale(.92);}
  .pbtn.play{
    width:46px;height:46px;font-size:18px;border:1px solid rgba(255,255,255,.38);
    background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.10));
    backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.40),inset 0 -2px 6px rgba(255,255,255,.10),0 6px 16px rgba(0,0,0,.22);
}
  .pbtn.play:hover{transform:scale(1.1);}
  .time{display:none;}

  /* 进度条：荧光填充，随进度自适应发光 */
  #progress{
    -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;
    background:rgba(255,255,255,.15);outline:none;cursor:pointer;
  }
  #progress::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;
    background:#fff;border:none;cursor:pointer;
    box-shadow:0 0 8px var(--accent),0 0 16px var(--accent),0 0 24px rgba(255,150,90,.6);
  }
  #progress::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:#fff;border:none;cursor:pointer;
    box-shadow:0 0 8px var(--accent),0 0 16px var(--accent),0 0 24px rgba(255,150,90,.6);
  }
  #progress::-moz-range-track{background:transparent;}
</style>
</head>
<body>
  <div class="bg" id="bgImg"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <canvas id="snow"></canvas>

  <div class="wrap">
    <div class="hero">
<div class="avatar" id="heroIcon">🌐</div>
      <h1 id="siteTitle">小哲分享</h1>
      <p id="siteDesc">精选链接，点击即可跳转</p>
    </div>

    <div id="content"></div>
    <div class="empty" id="emptyTip">没有找到匹配的内容</div>

    <footer id="footer">© 小哲分享</footer>
  </div>

  <audio id="audio" preload="none"></audio>

<script>
/* ============================================================
   ★★★ 自定义区：只改这一段 ★★★
   - siteTitle / siteDesc / heroIcon / footer：顶部与底部文字
   - LINKS：分类数组，每个分类下 items 放链接
     { icon:"📘", title:"名称", desc:"一句话说明", url:"https://跳转地址" }
   - MUSIC：播放器歌单
     { title:"歌曲名", url:"mp3 地址" }
     url 可以是：① 仓库内音乐文件相对路径，如 "music/song1.mp3"
                 ② 外部 mp3 直链（需可公开访问、无版权问题）
     ⚠️ 请使用你拥有版权或无版权的音乐，勿直接搬运付费歌曲直链。
   ============================================================ */

const siteTitle = "小哲分享";
const siteDesc  = "精选链接，点击即可跳转";
const heroIcon  = "🌐";
const footer    = "© 小哲分享";

const LINKS = [
  {
    category: "常用工具",
    items: [
      { icon:"📝", title:"文档工具", desc:"在线写作与协作", url:"https://example.com/doc" },
{ icon:"🎨", title:"设计素材", desc:"图片与模板资源", url:"https://example.com/design" },
      { icon:"🛠️", title:"效率工具", desc:"日常办公小工具", url:"https://example.com/tools" },
    ]
  },
  {
    category: "学习资源",
    items: [
      { icon:"📚", title:"课程合集", desc:"系统学习教程", url:"https://example.com/course" },
      { icon:"🔎", title:"资料检索", desc:"文献与资料查找", url:"https://example.com/search" },
      { icon:"🌐", title:"百科查询", desc:"常识与资料补充", url:"https://example.com/wiki" },
    ]
  },
  {
    category: "生活娱乐",
    items: [
      { icon:"🎬", title:"影视站点", desc:"观看与收藏", url:"https://example.com/movie" },
      { type:"player", icon:"🎵", title:"音乐在线播放", desc:"在线听歌" },
      { icon:"🎮", title:"休闲小游戏", desc:"解压放松", url:"https://example.com/game" },
    ]
  }
];

const MUSIC = [
  { title:"在情绪上头的时候", url:"music/1254.mp3" },
];

/* ================= 以下为渲染逻辑，一般不用改 ================= */
document.getElementById("siteTitle").textContent = siteTitle;
document.getElementById("siteDesc").textContent = siteDesc;
document.getElementById("heroIcon").textContent = heroIcon;
document.getElementById("footer").textContent = footer;

const content = document.getElementById("content");
const emptyTip = document.getElementById("emptyTip");

function render(keyword = "") {
  content.innerHTML = "";
  let total = 0;
  const kw = keyword.trim().toLowerCase();

  LINKS.forEach(group => {
    const items = group.items.filter(it =>
      !kw || it.title.toLowerCase().includes(kw) || it.desc.toLowerCase().includes(kw)
    );
    if (items.length === 0) return;
    total += items.length;

    const section = document.createElement("section");
    section.innerHTML = `<h2><span class="dot"></span>${group.category}</h2>`;
    const grid = document.createElement("div");
    grid.className = "grid";

    items.forEach(it => {
      if (it.type === "player") {
        const card = document.createElement("div");
        card.className = "card glass player-card";
        card.innerHTML = `
          <div class="pc-head">
<div class="icon">${it.icon || "🎵"}</div>
            <div class="info">
              <div class="bar-title" id="barTitle">未选择歌曲</div>
              <div class="bar-state" id="barState">点击播放</div>
            </div>
          </div>
          <div class="controls">
            <button class="pbtn" id="prevBtn" title="上一首">⏮</button>
            <button class="pbtn play" id="playBtn" title="播放/暂停">▶</button>
            <button class="pbtn" id="nextBtn" title="下一首">⏭</button>
          </div>
          <input type="range" id="progress" min="0" max="100" value="0">
          <div class="time"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></div>`;
        grid.appendChild(card);
        return;
      }
      const a = document.createElement("a");
      a.className = "card glass";
      a.href = it.url;
      a.target = "_blank"; a.rel = "noopener noreferrer";
      a.innerHTML = `
        <div class="icon">${it.icon || "🔗"}</div>
        <div class="info">
          <div class="title">${it.title}</div>
<div class="desc">${it.desc || ""}</div>
        </div>`;
      grid.appendChild(a);
    });
    section.appendChild(grid);
    content.appendChild(section);
  });

  emptyTip.style.display = total === 0 ? "block" : "none";
}

/* ================= 播放器逻辑 ================= */
const audio = document.getElementById("audio");
let barTitle, barState, playBtn, prevBtn, nextBtn, curTime, durTime, progress;
let cur = 0;

function fmt(sec){
  if(isNaN(sec)) return "0:00";
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return `${m}:${s<10?"0":""}${s}`;
}

function syncPlayUI(){
  const playing = !audio.paused && !audio.ended;
  if(playBtn) playBtn.textContent = playing ? "⏸" : "▶";
  if(barState) barState.textContent = playing ? "正在播放" : "已暂停";
}

function loadTrack(i, autoplay = true){
  cur = (i + MUSIC.length) % MUSIC.length;
  const track = MUSIC[cur];
  if(barTitle) barTitle.textContent = track.title || "未命名歌曲";
  audio.src = track.url || "";
  if(progress) progress.value = 0;
updateFill();
  if(curTime) curTime.textContent = "0:00";
  if(durTime) durTime.textContent = "0:00";
  if(!track.url){ if(playBtn) playBtn.textContent = "▶"; if(barState) barState.textContent = "暂无歌曲"; return; }
  if(autoplay) tryPlay();
}

function tryPlay(){
  audio.play().then(syncPlayUI).catch(()=>{ syncPlayUI(); });
}

function updateFill(){
  if(!progress) return;
  const p = progress.value;
  progress.style.background = `linear-gradient(90deg,var(--accent),var(--blob2) ${p}%,rgba(255,255,255,.15) ${p}%)`;
  progress.style.boxShadow = p > 1 ? "0 0 10px rgba(255,170,110,.55),0 0 18px rgba(255,122,176,.30)" : "none";
}

/* 播放器控件在网格卡片内动态渲染，渲染完成后绑定 */
function initPlayer(){
  barTitle = document.getElementById("barTitle");
  barState = document.getElementById("barState");
  playBtn = document.getElementById("playBtn");
  prevBtn = document.getElementById("prevBtn");
  nextBtn = document.getElementById("nextBtn");
  curTime = document.getElementById("curTime");
  durTime = document.getElementById("durTime");
progress = document.getElementById("progress");
  if(!playBtn) return;

  playBtn.onclick = () => {
    if(!MUSIC[cur] || !MUSIC[cur].url){ if(barState) barState.textContent = "暂无歌曲"; return; }
    if(audio.paused){ tryPlay(); } else { audio.pause(); syncPlayUI(); }
  };
  prevBtn.onclick = () => loadTrack(cur - 1);
  nextBtn.onclick = () => loadTrack(cur + 1);
  progress.oninput = () => {
    if(audio.duration){ audio.currentTime = (progress.value/100) * audio.duration; }
    updateFill();
  };
  if(MUSIC[cur] && barTitle) barTitle.textContent = MUSIC[cur].title || "未命名歌曲";
  updateFill();
  syncPlayUI();
}

render();
initPlayer();

audio.addEventListener("loadedmetadata", () => { if(durTime) durTime.textContent = fmt(audio.duration); });
audio.addEventListener("timeupdate", () => {
  if(audio.duration && progress){ progress.value = (audio.currentTime / audio.duration) * 100; }
  if(curTime) curTime.textContent = fmt(audio.currentTime);
  updateFill();
});
audio.addEventListener("play", syncPlayUI);
audio.addEventListener("pause", syncPlayUI);
audio.addEventListener("ended", () => loadTrack(cur + 1));

/* 自动播放：页面加载完先尝试；浏览器拦截有声自动播放时，首次交互即解锁 */
if(MUSIC.length) loadTrack(0, true);

function unlock(){
  tryPlay();
  ["pointerdown","touchstart","keydown"].forEach(ev => document.removeEventListener(ev, unlock));
}
["pointerdown","touchstart","keydown"].forEach(ev => document.addEventListener(ev, unlock, { once:true }));

/* 元数据就绪、整页加载完成后各再尝试一次，尽量促成自动播放 */
audio.addEventListener("loadedmetadata", () => { tryPlay(); });
window.addEventListener("load", () => { tryPlay(); });

/* ================= 动态雪花 ================= */
const snow = document.getElementById("snow");
const sctx = snow.getContext("2d");
let flakes = [];
let SW = 0, SH = 0;

function initSnow(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  SW = window.innerWidth; SH = window.innerHeight;
  snow.width = SW * dpr; snow.height = SH * dpr;
  snow.style.width = SW + "px"; snow.style.height = SH + "px";
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
const count = SW < 640 ? 35 : 70;
  flakes = Array.from({length: count}, () => ({
    x: Math.random() * SW,
    y: Math.random() * SH,
    r: 1.2 + Math.random() * 2.8,
    speed: 0.5 + Math.random() * 1.3,
    drift: 0.4 + Math.random() * 1.1,
    phase: Math.random() * Math.PI * 2,
    sway: 0.01 + Math.random() * 0.02,
    opacity: 0.35 + Math.random() * 0.5
  }));
}

function drawSnow(){
  sctx.clearRect(0, 0, SW, SH);
  flakes.forEach(f => {
    f.y += f.speed;
    f.phase += f.sway;
    f.x += Math.sin(f.phase) * f.drift;
    if (f.y > SH + 6){ f.y = -6; f.x = Math.random() * SW; }
    if (f.x < -6) f.x = SW + 6;
    if (f.x > SW + 6) f.x = -6;
    sctx.beginPath();
    sctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    sctx.fillStyle = `rgba(255,255,255,${f.opacity})`;
    sctx.fill();
  });
  requestAnimationFrame(drawSnow);
}

/* 首屏渲染完成后再启动雪花，避免抢占加载资源 */
function startSnow(){ initSnow(); drawSnow(); }
if(document.readyState === "complete"){ setTimeout(startSnow, 120); }
else{ window.addEventListener("load", () => setTimeout(startSnow, 120)); }
window.addEventListener("resize", () => { if(flakes.length) initSnow(); });

/* 背景图预加载，完成后淡入，先显示底色不空白等待 */
const bgImg = new Image();
bgImg.onload = () => document.getElementById("bgImg").classList.add("loaded");
bgImg.src = "assets/bg.jpg";
</script>
</body>
</html>
