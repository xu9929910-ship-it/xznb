<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小哲分享</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }
    body {
      min-height: 100vh;
      background-image: url("assets/bg.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      padding: 24px 16px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom:32px;
      color:#fff;
    }
    .hero-icon{
      width:72px;height:72px;
      border-radius:16px;
      background:rgba(255,255,255,0.2);
      display:flex;
      align-items:center;justify-content:center;
      font-size:36px;
      margin:0 auto 12px;
      backdrop-filter: blur(10px);
    }
    h1{
      font-size:28px;
      margin-bottom:6px;
    }
    .desc{
opacity:0.85;
    }
    .category-title{
      color:#fff;
      margin:28px 0 14px;
      font-size:16px;
      display:flex;
      align-items:center;
      gap:6px;
    }
    .card-wrap{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
      gap:14px;
    }
    .card{
      background:rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      border:1px solid rgba(255,255,255,0.18);
      border-radius:14px;
      padding:16px;
      color:#fff;
      cursor:pointer;
      transition: all 0.3s;
    }
    .card:hover{
      background:rgba(255,255,255,0.22);
      transform: translateY(-3px);
    }
    .card .icon{
      font-size:26px;
      margin-bottom:8px;
    }
    .card h3{
      font-size:17px;
      margin-bottom:4px;
    }
    .card p{
      font-size:13px;
      opacity:0.75;
    }
    footer{
      text-align:center;
      color:rgba(255,255,255,0.7);
      margin-top:40px;
      font-size:14px;
    }
    .player-wrap{
      position:fixed;
bottom:20px;
      left:50%;
      transform:translateX(-50%);
      width:min(94%,520px);
      background:rgba(255,255,255,0.14);
      backdrop-filter: blur(14px);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:16px;
      padding:14px;
      color:#fff;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="hero-icon" id="heroIcon">🌐</div>
    <h1 id="siteTitle">小哲分享</h1>
    <p class="desc" id="siteDesc">精选链接，点击即可跳转</p>
  </header>
  <div id="content"></div>
  <footer id="footer">© 小哲分享</footer>
</div>

<div class="player-wrap">
  <audio controls id="audioPlayer">
    <source src="music/1254.mp3">
  
</div>

<script>
const siteTitle = "小哲分享";
const siteDesc = "精选链接，点击即可跳转";
const heroIcon = "🌐";
const footer = "© 小哲分享";

const data = [
  {
    category: "常用工具",
    items: [
      { icon: "📝", title: "文档工具", desc: "在线写作与协作", url: "https://example.com/doc" },
      { icon: "🎨", title: "设计素材", desc: "图片与模板资源", url: "https://example.com/design" },
{ icon: "🛠️", title: "效率工具", desc: "日常办公小工具", url: "https://example.com/tools" },
    ]
  },
  {
    category: "学习资源",
    items: [
      { icon: "📚", title: "课程合集", desc: "系统学习教程", url: "https://example.com/course" },
      { icon: "🔍", title: "资料检索", desc: "文献与资料查找", url: "https://example.com/search" },
    ]
  },
  {
    category: "生活娱乐",
    items: [
      { icon: "🎬", title: "影视站点", desc: "观看与收藏", url: "https://example.com/movie" },
      { icon: "🎵", title: "音乐播放", desc: "在线听歌", url: "https://example.com/music" },
    ]
  }
];

document.getElementById("siteTitle").textContent = siteTitle;
document.getElementById("siteDesc").textContent = siteDesc;
document.getElementById("heroIcon").textContent = heroIcon;
document.getElementById("footer").textContent = footer;

const content = document.getElementById("content");
function render(){
  content.innerHTML = "";
  data.forEach(group=>{
    const catDiv = document.createElement("div");
    catDiv.innerHTML = `<div class="category-title">● ${group.category}</div>`;
    const cardWrap = document.createElement("div");
    cardWrap.className = "card-wrap";
    group.items.forEach(item=>{
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="icon">${item.icon}</div>
        <h3>${item.title}</h3>
        <p>${item.desc}</p>
      `;
      card.onclick = ()=> window.open(item.url,"_blank");
      cardWrap.appendChild(card);
    })
    catDiv.appendChild(cardWrap);
    content.appendChild(catDiv);
  })
}
render();
</script>
</body>
</html>
